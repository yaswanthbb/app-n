services:
  - type: web
    name: news-app-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PUBLISH_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: news-app-db
          property: connectionString
databases:
  - name: news-app-db
    plan: free
    databaseName: newsapp
    user: newsapp
    ipAllowList: []
